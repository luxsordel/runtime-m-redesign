name: Ошибка
description: Что-то работает не так
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Страница (URL)
  - type: textarea
    id: what
    attributes:
      label: Что происходит и что ожидалось
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести / скриншот
